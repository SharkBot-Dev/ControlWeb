<html>
    <head>
        <title>Youtube Player</title>

        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .fullscreen-iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                border: none;
            }
        </style>
    </head>

    <body>
        <iframe class="fullscreen-iframe" width="1001" height="563" src="https://www.youtube.com/embed/{{videoid}}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </body>
</html>
